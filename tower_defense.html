<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏰 ป้อมปราการธาตุ - Elemental Tower Defense</title>
<style>
  :root{
    --pink:#ff9ecb; --blue:#7fd1ff; --green:#8be28b; --yellow:#ffe066; --purple:#c9a6ff;
    --panel:#fff8ef; --ink:#4a3a2c; --shadow: rgba(60,40,20,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Comic Sans MS','Baloo 2','Trebuchet MS',cursive,sans-serif;
    background: radial-gradient(circle at 20% 10%, #bdeaff 0%, #a0dfff 35%, #8fd3f4 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    overflow:auto;
    padding:12px;
  }
  #app{
    width:100%; max-width:1200px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .screen{ width:100%; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .hidden{ display:none !important; }

  /* ---------- Buttons ---------- */
  button{
    font-family:inherit; cursor:pointer; border:none; outline:none;
    border-radius:16px; font-weight:bold; color:#5a3b22;
    background: linear-gradient(180deg,#fff2d0,#ffd27a);
    box-shadow: 0 4px 0 #c99a3f, 0 6px 10px var(--shadow);
    padding:10px 18px; font-size:16px; transition: transform .08s, box-shadow .08s;
  }
  button:hover{ transform: translateY(-2px); }
  button:active{ transform: translateY(2px); box-shadow:0 1px 0 #c99a3f; }
  button:disabled{ opacity:.45; cursor:not-allowed; filter:grayscale(.3); transform:none; }
  button.ghost{ background:linear-gradient(180deg,#eef9ff,#cdeeff); box-shadow:0 4px 0 #8fcbe8, 0 6px 10px var(--shadow); }
  button.danger{ background:linear-gradient(180deg,#ffd6d6,#ff9b9b); box-shadow:0 4px 0 #d35d5d, 0 6px 10px var(--shadow); }
  button.small{ padding:6px 10px; font-size:13px; border-radius:12px; }

  /* ---------- Title screen ---------- */
  #screen-menu{ text-align:center; padding-top:20px; }
  .title-card{
    background: var(--panel); border-radius:28px; padding:30px 40px;
    box-shadow: 0 10px 0 #e8d3ab, 0 18px 30px var(--shadow);
    border:6px solid #fff;
  }
  .title-card h1{
    font-size:42px; margin:0 0 6px; color:#ff7a59;
    text-shadow: 3px 3px 0 #fff, 0 0 10px rgba(255,255,255,.6);
  }
  .title-card p{ margin:4px 0 18px; font-size:16px; color:#6b5a46; }
  .emoji-row{ font-size:38px; margin-bottom:10px; letter-spacing:6px; }
  .menu-btns{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }

  /* ---------- Level select ---------- */
  #screen-levels .panel-card{
    background:var(--panel); border-radius:24px; padding:24px; border:6px solid #fff;
    box-shadow: 0 10px 0 #e8d3ab, 0 18px 30px var(--shadow);
    width:100%; max-width:760px;
  }
  .lvl-grid{
    display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin:18px 0;
  }
  .lvl-btn{
    aspect-ratio:1/1; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:22px; gap:4px; background: linear-gradient(180deg,#d7ffd9,#9ee6a4);
    box-shadow:0 5px 0 #5fae68, 0 8px 14px var(--shadow);
  }
  .lvl-btn.locked{ background:linear-gradient(180deg,#e4e4e4,#bdbdbd); box-shadow:0 5px 0 #8a8a8a; }
  .lvl-btn .stars{ font-size:12px; }
  .lvl-btn .num{ font-weight:bold; font-size:24px; }
  .lvl-btn .tname{ font-size:11px; }

  /* ---------- Game screen ---------- */
  #screen-game{ align-items:center; }
  #hud{
    width:100%; max-width:1100px; display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border-radius:18px; padding:8px 16px; border:4px solid #fff;
    box-shadow:0 6px 0 #e8d3ab, 0 10px 16px var(--shadow); flex-wrap:wrap; gap:8px;
  }
  .hud-stats{ display:flex; gap:16px; font-size:17px; font-weight:bold; flex-wrap:wrap; }
  .hud-stats span.tag{ background:#fff; padding:4px 10px; border-radius:12px; box-shadow:inset 0 0 0 2px #ffe9c2; }
  .hud-ctrls{ display:flex; gap:8px; flex-wrap:wrap; }

  #game-area{ display:flex; gap:14px; align-items:flex-start; flex-wrap:nowrap; justify-content:center; width:100%; max-width:1100px; }
  #canvas-wrap{ position:relative; border-radius:20px; overflow:hidden; border:6px solid #fff; box-shadow:0 10px 0 #cfa86a,0 16px 26px var(--shadow); flex:0 0 auto; }
  canvas{ display:block; background:#9ad878; }

  #sidebar{
    width:250px; flex:0 0 250px; background:var(--panel); border-radius:20px; padding:14px; border:5px solid #fff;
    box-shadow:0 8px 0 #e8d3ab,0 14px 22px var(--shadow); display:flex; flex-direction:column; gap:10px;
  }
  #sidebar h3{ margin:0 0 2px; font-size:15px; color:#8a6a3c; text-align:center; }
  .tower-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 10px; border-radius:14px;
  }
  .tower-btn .ic{ width:48px; height:58px; flex:0 0 48px; }
  .tower-btn .ic canvas{ display:block; width:48px; height:58px; background:none; }
  .tower-btn .info{ display:flex; flex-direction:column; line-height:1.2; }
  .tower-btn .info b{ font-size:14px; }
  .tower-btn .info small{ font-size:11px; color:#8a6a3c; }
  .tower-btn.selected{ outline:3px solid #ff8a3d; }

  #upgrade-panel{ background:#fff4df; border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:6px; }
  #upgrade-panel .row{ display:flex; justify-content:space-between; font-size:13px; }
  #upgrade-panel .btn-row{ display:flex; gap:6px; margin-top:4px; }
  #wave-info{ font-size:13px; background:#fff4df; border-radius:14px; padding:8px 10px; text-align:center; }

  /* ---------- Overlay modals ---------- */
  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:50;
  }
  .modal{
    background:var(--panel); border-radius:26px; padding:28px 34px; text-align:center; border:6px solid #fff;
    box-shadow:0 14px 0 #e8d3ab,0 20px 34px rgba(0,0,0,.4); max-width:420px;
  }
  .modal h2{ margin:0 0 8px; font-size:30px; }
  .modal .stars-big{ font-size:40px; margin:10px 0; }
  .modal-btns{ display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }

  footer{ font-size:12px; color:#4a6b8a; opacity:.8; margin-top:4px;}
  body.dark footer{ color:#ffe6c9; }
</style>
</head>
<body>
<div id="app">

  <!-- ===== MAIN MENU ===== -->
  <div id="screen-menu" class="screen">
    <div class="title-card">
      <div class="emoji-row">🔥💧🪨🌪️⚡</div>
      <h1>ป้อมปราการธาตุ</h1>
      <p>Elemental Tower Defense — 10 ด่านสุดน่ารัก!</p>
      <div class="menu-btns">
        <button id="btn-play">▶️ เริ่มเล่น</button>
        <button class="ghost" id="btn-howto">❓ วิธีเล่น</button>
        <button class="danger" id="btn-reset">🗑️ ล้างความคืบหน้า</button>
      </div>
    </div>
  </div>

  <!-- ===== LEVEL SELECT ===== -->
  <div id="screen-levels" class="screen hidden">
    <div class="panel-card">
      <h2 style="text-align:center;margin:0;">เลือกด่าน 🗺️</h2>
      <div class="lvl-grid" id="lvl-grid"></div>
      <div style="text-align:center;">
        <button class="ghost" id="btn-back-menu">⬅️ กลับเมนู</button>
      </div>
    </div>
  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div id="screen-game" class="screen hidden">
    <div id="hud">
      <div class="hud-stats">
        <span class="tag" id="hud-level">ด่าน 1</span>
        <span class="tag" id="hud-gold">🪙 0</span>
        <span class="tag" id="hud-lives">❤️ 20</span>
        <span class="tag" id="hud-wave">🌊 คลื่น 0/0</span>
      </div>
      <div class="hud-ctrls">
        <button class="ghost small" id="btn-pause">⏸️</button>
        <button class="ghost small" id="btn-speed">⏩ x1</button>
        <button class="ghost small" id="btn-sound">🔊</button>
        <button class="danger small" id="btn-quit">🏠 เมนู</button>
      </div>
    </div>

    <div id="game-area">
      <div id="canvas-wrap">
        <canvas id="canvas" width="800" height="500"></canvas>
      </div>
      <div id="sidebar">
        <h3>🧙 สร้างหอคอยธาตุ</h3>
        <div id="tower-buttons"></div>
        <div id="wave-info">
          <div id="wave-text">เตรียมตัว...</div>
          <button class="small" id="btn-next-wave" style="margin-top:6px;">⏭️ เรียกคลื่นถัดไป</button>
        </div>
        <div id="upgrade-panel" class="hidden"></div>
      </div>
    </div>
  </div>

  <footer>ทำด้วย ❤️ — เกม Tower Defense ไฟล์เดียว HTML5</footer>
</div>

<div id="overlay" class="hidden">
  <div class="modal" id="modal-content"></div>
</div>

<script>
"use strict";
/* ============================================================
   CONSTANTS & UTILITIES
============================================================ */
const CANVAS_W = 800, CANVAS_H = 500;
const PATH_WIDTH = 42;
const MAX_TOWER_LEVEL = 5;
const TOTAL_LEVELS = 10;

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// seeded PRNG (mulberry32) for deterministic level layouts
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pointToSegmentDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const len2 = dx*dx+dy*dy;
  let t = len2===0 ? 0 : ((px-x1)*dx+(py-y1)*dy)/len2;
  t = clamp(t,0,1);
  const cx = x1+dx*t, cy = y1+dy*t;
  return dist(px,py,cx,cy);
}

function distToPath(px,py,path){
  let min = Infinity;
  for(let i=0;i<path.length-1;i++){
    const d = pointToSegmentDist(px,py,path[i].x,path[i].y,path[i+1].x,path[i+1].y);
    if(d<min) min=d;
  }
  return min;
}

/* ============================================================
   TOWER TYPES (ธาตุทั้ง 5)
============================================================ */
const TOWER_TYPES = {
  fire:    { key:'fire',    name:'นักรบเพลิง',   emoji:'🔥', color:'#ff6b4a', dark:'#c6431f', cost:50,
             dmg:16, range:108, rate:700,  splash:42, desc:'ดาเมจเป็นวงกว้าง + เผาไหม้ต่อเนื่อง',
             burn:{ dmg:4, ticks:5, tickMs:400 } },
  water:   { key:'water',   name:'นักรบสายชล',   emoji:'💧', color:'#4ea8de', dark:'#1f6fa8', cost:45,
             dmg:9,  range:120, rate:550,  splash:0,  desc:'ทำให้ศัตรูช้าลง',
             slow:{ factor:0.45, ms:1500 } },
  earth:   { key:'earth',   name:'นักรบศิลา',    emoji:'🪨', color:'#a9774a', dark:'#6e4b28', cost:70,
             dmg:34, range:95,  rate:1300, splash:55, desc:'ดาเมจสูงมาก + มีโอกาสทำให้มึนงง',
             stun:{ chance:0.22, ms:650 } },
  wind:    { key:'wind',    name:'นักรบวายุ',    emoji:'🌪️', color:'#8de5c7', dark:'#3f9c80', cost:55,
             dmg:7,  range:100, rate:260,  splash:0,  desc:'ยิงไวมาก + ผลักศัตรูถอยหลัง',
             knockback:16 },
  thunder: { key:'thunder', name:'นักรบสายฟ้า',  emoji:'⚡', color:'#f4d35e', dark:'#b89324', cost:90,
             dmg:13, range:130, rate:650,  splash:0,  desc:'ฟ้าผ่ากระโดดโจมตีหลายเป้าหมาย',
             chain:3, chainRange:95 },
};
const TOWER_ORDER = ['fire','water','earth','wind','thunder'];

function towerStat(tower, key){
  const base = TOWER_TYPES[tower.type];
  const mult = 1 + (tower.level-1)*0.22;
  if(key==='dmg') return base.dmg*mult;
  if(key==='range') return base.range*(1+(tower.level-1)*0.08);
  if(key==='rate') return base.rate*(1-(tower.level-1)*0.08);
  if(key==='splash') return base.splash*(1+(tower.level-1)*0.08);
  return base[key];
}
function upgradeCost(tower){
  const base = TOWER_TYPES[tower.type].cost;
  return Math.round(base*0.65*tower.level);
}
function towerTotalSpent(tower){
  let total = TOWER_TYPES[tower.type].cost;
  for(let l=1;l<tower.level;l++) total += Math.round(TOWER_TYPES[tower.type].cost*0.65*l);
  return total;
}

/* ============================================================
   ENEMY TYPES
============================================================ */
const ENEMY_TYPES = {
  slime:  { key:'slime',  name:'สไลม์',   emoji:'🟢', hp:38,  speed:58,  radius:15, color:'#7ed957', dark:'#4a9c34', reward:4,  dmgToBase:1 },
  bat:    { key:'bat',    name:'ค้างคาว', emoji:'🦇', hp:20,  speed:96,  radius:12, color:'#c99bff', dark:'#8a5fd6', reward:3,  dmgToBase:1 },
  tank:   { key:'tank',   name:'เต่าหิน', emoji:'🐢', hp:150, speed:33,  radius:21, color:'#9b8f6b', dark:'#6b5f42', reward:9,  dmgToBase:2 },
  brute:  { key:'brute',  name:'ก้อนหิน', emoji:'👹', hp:260, speed:40,  radius:24, color:'#ff8a6b', dark:'#c6502f', reward:14, dmgToBase:3 },
  boss:   { key:'boss',   name:'ราชามังกร', emoji:'🐉', hp:2200,speed:26, radius:36, color:'#ff5c8a', dark:'#b8275a', reward:150,dmgToBase:10 },
};

/* ============================================================
   PATH GENERATION (deterministic per level, orthogonal "snake")
============================================================ */
const COL_X = [100, 224, 348, 472, 596, 710];
const ROW_Y = [70, 160, 250, 340, 430];

function buildPath(level){
  const rnd = mulberry32(level*7919 + 13);
  const rows = [];
  rows.push(Math.floor(rnd()*ROW_Y.length));
  for(let i=1;i<COL_X.length;i++){
    let next;
    let guard=0;
    do{ next = Math.floor(rnd()*ROW_Y.length); guard++; }while(next===rows[i-1] && guard<20);
    rows.push(next);
  }
  const pts = [];
  pts.push({x:-24, y:ROW_Y[rows[0]]});
  pts.push({x:COL_X[0], y:ROW_Y[rows[0]]});
  for(let i=1;i<COL_X.length;i++){
    pts.push({x:COL_X[i-1], y:ROW_Y[rows[i]]});
    pts.push({x:COL_X[i], y:ROW_Y[rows[i]]});
  }
  pts.push({x:CANVAS_W+24, y:ROW_Y[rows[rows.length-1]]});
  // remove zero-length duplicate points
  const clean=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const p = pts[i], q = clean[clean.length-1];
    if(Math.abs(p.x-q.x)>0.01 || Math.abs(p.y-q.y)>0.01) clean.push(p);
  }
  return clean;
}

function pathTotalLength(path){
  let total=0;
  for(let i=0;i<path.length-1;i++) total += dist(path[i].x,path[i].y,path[i+1].x,path[i+1].y);
  return total;
}

/* ============================================================
   WAVE GENERATION
============================================================ */
function buildWaveDefs(level){
  const waveCount = 5 + Math.ceil(level/2); // 6..10
  const defs = [];
  for(let w=0; w<waveCount; w++){
    const groups = [];
    const p = w/(waveCount-1||1);
    const lvlFactor = level + p*1.4;
    groups.push({type:'slime', count:Math.round(4+lvlFactor*1.1), interval:520});
    if(level>=2 || w>=2) groups.push({type:'bat', count:Math.round(2+lvlFactor*0.7), interval:360});
    if(level>=4 && w>=1) groups.push({type:'tank', count:Math.round(1+lvlFactor*0.3), interval:1000});
    if(level>=7 && w>=2) groups.push({type:'brute', count:Math.round(1+(level-6)*0.4+p*2), interval:1150});
    if(level>=TOTAL_LEVELS && w===waveCount-1){
      groups.push({type:'boss', count:1, interval:0});
      groups.push({type:'brute', count:4, interval:900});
    }
    defs.push(groups);
  }
  return defs;
}

function levelConfig(level){
  return {
    level,
    path: buildPath(level),
    waves: buildWaveDefs(level),
    startGold: 170 + level*8,
    startLives: 20,
    hpScale: 1 + (level-1)*0.24,
    speedScale: 1 + (level-1)*0.025,
    rewardScale: 1 + (level-1)*0.10,
  };
}

/* ============================================================
   SAVE / LOAD PROGRESS
============================================================ */
const SAVE_KEY = 'etd_progress_v1';
function loadProgress(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return { unlocked:1, stars:{} };
    const data = JSON.parse(raw);
    if(!data.unlocked) data.unlocked=1;
    if(!data.stars) data.stars={};
    return data;
  }catch(e){ return { unlocked:1, stars:{} }; }
}
function saveProgress(p){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(p)); }catch(e){}
}
let progress = loadProgress();

/* ============================================================
   GAME STATE
============================================================ */
const state = {
  cfg:null, level:1,
  gold:0, lives:0, startLives:20,
  towers:[], enemies:[], projectiles:[], particles:[],
  waveIndex:-1, waveQueue:[], waveClockMs:0, waveActive:false,
  betweenWaveTimer:0, BETWEEN_WAVE_MS:9000,
  selectedBuildType:null, selectedTower:null, hoverPos:null,
  paused:false, speedMult:1, soundOn:true,
  gameOver:false, levelWon:false, lastTime:0,
  shotId:0,
};

function resetStateForLevel(level){
  state.cfg = levelConfig(level);
  state.theme = THEMES[(level-1)%THEMES.length];
  state.level = level;
  state.gold = state.cfg.startGold;
  state.lives = state.cfg.startLives;
  state.startLives = state.cfg.startLives;
  state.towers = [];
  state.enemies = [];
  state.projectiles = [];
  state.particles = [];
  state.waveIndex = -1;
  state.waveQueue = [];
  state.waveClockMs = 0;
  state.waveActive = false;
  state.betweenWaveTimer = 2500;
  state.selectedBuildType = null;
  state.selectedTower = null;
  state.paused = false;
  state.speedMult = 1;
  state.gameOver = false;
  state.levelWon = false;
}

function startNextWave(){
  state.waveIndex++;
  if(state.waveIndex >= state.cfg.waves.length){ return false; }
  const groups = state.cfg.waves[state.waveIndex];
  const events = [];
  groups.forEach(g=>{
    for(let i=0;i<g.count;i++) events.push({ type:g.type, t:i*g.interval + Math.random()*80 });
  });
  events.sort((a,b)=>a.t-b.t);
  state.waveQueue = events;
  state.waveClockMs = 0;
  state.waveActive = true;
  playSfx('wave');
  return true;
}

function spawnEnemy(typeKey){
  const base = ENEMY_TYPES[typeKey];
  const cfg = state.cfg;
  const hp = Math.round(base.hp*cfg.hpScale);
  const enemy = {
    type: typeKey, hp, maxHp:hp,
    speed: base.speed*cfg.speedScale,
    radius: base.radius, color: base.color, dark: base.dark, emoji: base.emoji,
    reward: Math.round(base.reward*cfg.rewardScale), dmgToBase: base.dmgToBase,
    segIndex:0, segProgress:0, traveled:0,
    x: cfg.path[0].x, y: cfg.path[0].y,
    slowUntil:0, slowFactor:1, stunUntil:0,
    burnUntil:0, burnTickAt:0, burnDmg:0,
    hitFlash:0, bob: Math.random()*Math.PI*2,
    alive:true,
  };
  state.enemies.push(enemy);
}

/* ============================================================
   ENTITIES: path movement helper
============================================================ */
function moveEnemyAlongPath(enemy, deltaDist){
  const path = state.cfg.path;
  let remaining = deltaDist;
  if(remaining>0){
    while(remaining>0){
      if(enemy.segIndex >= path.length-1){ enemy.traveled += remaining; remaining=0; reachBase(enemy); return; }
      const a = path[enemy.segIndex], b = path[enemy.segIndex+1];
      const segLen = dist(a.x,a.y,b.x,b.y);
      const left = segLen - enemy.segProgress;
      if(remaining <= left){
        enemy.segProgress += remaining;
        remaining = 0;
      } else {
        remaining -= left;
        enemy.segIndex++;
        enemy.segProgress = 0;
      }
    }
  } else if(remaining<0){
    let back = -remaining;
    while(back>0){
      if(enemy.segIndex<=0 && enemy.segProgress<=0){ break; }
      if(back <= enemy.segProgress){
        enemy.segProgress -= back; back=0;
      } else {
        back -= enemy.segProgress;
        if(enemy.segIndex>0){
          enemy.segIndex--;
          const a = path[enemy.segIndex], b = path[enemy.segIndex+1];
          enemy.segProgress = dist(a.x,a.y,b.x,b.y);
        } else { enemy.segProgress = 0; back = 0; }
      }
    }
  }
  if(enemy.segIndex < path.length-1){
    const a = path[enemy.segIndex], b = path[enemy.segIndex+1];
    const segLen = dist(a.x,a.y,b.x,b.y) || 1;
    const t = clamp(enemy.segProgress/segLen,0,1);
    enemy.x = lerp(a.x,b.x,t);
    enemy.y = lerp(a.y,b.y,t);
  }
}

function reachBase(enemy){
  if(!enemy.alive) return;
  enemy.alive = false;
  state.lives -= enemy.dmgToBase;
  spawnTextParticle(CANVAS_W-18, state.cfg.path[state.cfg.path.length-1].y, '-'+enemy.dmgToBase, '#ff4d4d');
  playSfx('hurt');
  if(state.lives<=0){ state.lives=0; triggerGameOver(); }
}

function killEnemy(enemy){
  if(!enemy.alive) return;
  enemy.alive = false;
  state.gold += enemy.reward;
  spawnPoof(enemy.x, enemy.y, enemy.color);
  spawnTextParticle(enemy.x, enemy.y-10, '+'+enemy.reward, '#ffb000');
  playSfx('kill');
}

function spawnTextParticle(x,y,text,color){

function spawnSpark(x,y,color){

    const ang = Math.random()*Math.PI*2;
    const spd = 60+Math.random()*60;
    state.particles.push({ kind:'poof', x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:0, maxLife:250, color, size:2+Math.random()*3 });

/* ============================================================
   TOWER FIRING / PROJECTILES
============================================================ */
function findTarget(tower){
  const range = towerStat(tower,'range');
  let best=null, bestProgress=-1;
  for(const e of state.enemies){
    if(!e.alive) continue;
    if(dist(tower.x,tower.y,e.x,e.y) <= range){
      const prog = e.segIndex*10000 + e.segProgress;
      if(prog>bestProgress){ bestProgress=prog; best=e; }
    }
  }
  return best;
}

function fireTower(tower, target){
  const type = TOWER_TYPES[tower.type];
  state.projectiles.push({
    x: tower.x, y: tower.y-18, target, towerType: tower.type,
    dmg: towerStat(tower,'dmg'), splash: towerStat(tower,'splash'),
    speed: 480, color: type.color, alive:true, trail:[],
  });
  tower.attackT = 1;
  playSfx('shoot', 0.25);
}

function applyHit(proj, enemy){
  const type = TOWER_TYPES[proj.towerType];
  dealDamage(enemy, proj.dmg);
  spawnSpark(enemy.x, enemy.y, proj.color);
  if(proj.splash>0){
    for(const e2 of state.enemies){
      if(e2===enemy || !e2.alive) continue;
      if(dist(e2.x,e2.y,enemy.x,enemy.y) <= proj.splash){
        dealDamage(e2, proj.dmg*0.6);
      }
    }
  }
  if(type.slow){ enemy.slowUntil = performance.now()+type.slow.ms; enemy.slowFactor = type.slow.factor; }
  if(type.burn){
    enemy.burnUntil = performance.now() + type.burn.ticks*type.burn.tickMs;
    enemy.burnTickAt = performance.now() + type.burn.tickMs;
    enemy.burnDmg = type.burn.dmg;
  }
  if(type.stun && Math.random()<type.stun.chance){ enemy.stunUntil = performance.now()+type.stun.ms; }
  if(type.knockback){ moveEnemyAlongPath(enemy, -type.knockback); }
  if(type.chain){
    const hit = new Set([enemy]);
    let current = enemy;
    for(let c=0;c<type.chain-1;c++){
      let next=null, bestD=type.chainRange;
      for(const e2 of state.enemies){
        if(!e2.alive || hit.has(e2)) continue;
        const d = dist(current.x,current.y,e2.x,e2.y);
        if(d<=bestD){ bestD=d; next=e2; }
      }
      if(!next) break;
      state.particles.push({ kind:'bolt', x1:current.x,y1:current.y, x2:next.x,y2:next.y, life:0, maxLife:160, color:'#fff07a' });
      dealDamage(next, proj.dmg*0.7);
      spawnSpark(next.x, next.y, '#fff07a');
      hit.add(next);
      current = next;
    }
  }
}

function dealDamage(enemy, dmg){
  if(!enemy.alive) return;
  enemy.hp -= dmg;
  enemy.hitFlash = 1;
  if(enemy.hp<=0) killEnemy(enemy);
}

/* ============================================================
   MAIN UPDATE TICK
============================================================ */
function updateGame(dtMs){
  if(state.paused || state.gameOver || state.levelWon) return;
  const dt = dtMs/1000;
  const now = performance.now();

  // wave spawn queue
  if(state.waveActive){
    state.waveClockMs += dtMs;
    while(state.waveQueue.length && state.waveQueue[0].t <= state.waveClockMs){
      spawnEnemy(state.waveQueue.shift().type);
    }
    if(state.waveQueue.length===0 && state.enemies.every(e=>!e.alive)){
      state.waveActive = false;
      state.enemies = state.enemies.filter(e=>e.alive);
      if(state.waveIndex >= state.cfg.waves.length-1){
        triggerLevelComplete();
        return;
      } else {
        state.gold += 15;
        state.betweenWaveTimer = state.BETWEEN_WAVE_MS;
      }
    }
  } else if(!state.gameOver && !state.levelWon){
    state.betweenWaveTimer -= dtMs;
    if(state.betweenWaveTimer<=0){ startNextWave(); }
  }

  // enemies
  for(const e of state.enemies){
    if(!e.alive) continue;
    e.bob += dt*6;
    if(e.hitFlash>0) e.hitFlash = Math.max(0, e.hitFlash-dt*3);
    let spd = e.speed;
    if(now < e.stunUntil){ spd = 0; }
    else if(now < e.slowUntil){ spd *= e.slowFactor; }
    if(now < e.burnUntil && now >= e.burnTickAt){
      dealDamage(e, e.burnDmg);
      e.burnTickAt = now + 400;
      spawnSpark(e.x,e.y,'#ff8a3d');
    }
    if(e.alive) moveEnemyAlongPath(e, spd*dt);
  }
  state.enemies = state.enemies.filter(e=>e.alive);

  // towers
  for(const t of state.towers){
    t.cooldown -= dtMs;
    t.attackT = Math.max(0, (t.attackT||0) - dtMs/280);
    t.angle = t.angle||0;
    if(t.target && (!t.target.alive || dist(t.x,t.y,t.target.x,t.target.y)>towerStat(t,'range'))) t.target=null;
    if(!t.target) t.target = findTarget(t);
    if(t.target){
      t.angle = Math.atan2(t.target.y-t.y, t.target.x-t.x);
      t.facing = t.target.x < t.x ? -1 : 1;
      if(t.cooldown<=0){
        fireTower(t, t.target);
        t.cooldown = towerStat(t,'rate');
      }
    }
  }

  // projectiles
  for(const p of state.projectiles){
    if(!p.alive) continue;
    if(!p.target || !p.target.alive){ p.alive=false; continue; }
    const d = dist(p.x,p.y,p.target.x,p.target.y);
    const step = p.speed*dt;
    if(d <= step+p.target.radius){
      applyHit(p, p.target);
      p.alive = false;
    } else {
      p.x += (p.target.x-p.x)/d*step;
      p.y += (p.target.y-p.y)/d*step;
    }
  }
  state.projectiles = state.projectiles.filter(p=>p.alive);

  // particles
  for(const pa of state.particles){
    pa.life += dtMs;
    if(pa.x!==undefined){ pa.x += (pa.vx||0)*dt; pa.y += (pa.vy||0)*dt; }
  }
  state.particles = state.particles.filter(pa=>pa.life < pa.maxLife);
}

function triggerGameOver(){
  state.gameOver = true;
  playSfx('lose');
  showModal({
    title:'😵 แพ้แล้ว!', emoji:'💔',
    body:`ด่าน ${state.level} — ป้อมปราการถูกทำลาย!`,
    buttons:[
      {label:'🔁 ลองใหม่', action:()=>{ hideModal(); openLevel(state.level); }},
      {label:'🗺️ เลือกด่าน', action:()=>{ hideModal(); showLevels(); }},
    ]
  });
}

function triggerLevelComplete(){
  state.levelWon = true;
  const ratio = state.lives/state.startLives;
  let stars = 1;
  if(ratio>=0.8) stars=3; else if(ratio>=0.4) stars=2;
  progress.stars[state.level] = Math.max(progress.stars[state.level]||0, stars);
  progress.unlocked = Math.max(progress.unlocked, Math.min(TOTAL_LEVELS, state.level+1));
  saveProgress(progress);
  playSfx('win');
  const nextAvail = state.level < TOTAL_LEVELS;
  showModal({
    title:'🎉 ผ่านด่าน!', emoji:'🏆',
    body:`ด่าน ${state.level} สำเร็จ! เหลือชีวิต ${state.lives}/${state.startLives}`,
    stars,
    buttons:[
      ...(nextAvail ? [{label:'➡️ ด่านถัดไป', action:()=>{ hideModal(); openLevel(state.level+1); }}]:[]),
      {label:'🗺️ เลือกด่าน', action:()=>{ hideModal(); showLevels(); }},
      {label:'🔁 เล่นซ้ำ', action:()=>{ hideModal(); openLevel(state.level); }},
    ]
  });
}

// deterministic decorative props and ambient particles per level, placed off-path
let decorProps = [];
let ambientProps = [];
function buildDecor(level){
  const th = state.theme;
  const rnd = mulberry32(level*31+99);
  const total = th.decor.reduce((s,d)=>s+d[1],0);
  const props = [];
  let tries=0;
  while(props.length<34 && tries<800){
    tries++;
    const x = 20+rnd()*(CANVAS_W-40), y = 20+rnd()*(CANVAS_H-40);
    if(distToPath(x,y,state.cfg.path) < PATH_WIDTH/2+26) continue;
    let pick = rnd()*total, kind = th.decor[0][0];
    for(const [k,w] of th.decor){ if(pick<w){ kind=k; break; } pick-=w; }
    props.push({ x,y, kind, hue: Math.floor(rnd()*6), scale:0.8+rnd()*0.5 });
  }
  props.sort((a,b)=>a.y-b.y);
  decorProps = props;
  ambientProps = [];
  if(th.ambient!=='none'){
    for(let i=0;i<34;i++){
      ambientProps.push({ x:rnd()*CANVAS_W, y:rnd()*CANVAS_H, sp:0.6+rnd()*1.2, s:1.2+rnd()*2.6, ph:rnd()*6.28 });
    }
  }
}

function polygon(pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
}

function drawDecorItem(d, th, t){
  ctx.save();
  ctx.translate(d.x,d.y);
  ctx.scale(d.scale,d.scale);
  ctx.lineJoin='round'; ctx.lineCap='round';
  const shadow = (w)=>{ ctx.fillStyle='rgba(0,0,0,0.16)'; ctx.beginPath(); ctx.ellipse(0,11,w,4,0,0,TAU); ctx.fill(); };
  switch(d.kind){
    case 'flower': {
      const colors = ['#ff8fb7','#fff07a','#ffffff','#a6e3ff','#ffb067','#d9a6ff'];
      ctx.fillStyle = colors[d.hue];
      for(let i=0;i<5;i++){
        const ang = i/5*TAU;
        ctx.beginPath(); ctx.ellipse(Math.cos(ang)*6, Math.sin(ang)*6, 4.5,3.2, ang, 0, TAU); ctx.fill();
      }
      ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(0,0,3.4,0,TAU); ctx.fill();
      break;
    }
    case 'bush':
      ctx.fillStyle = th.leaf||'#6fbf5a'; ctx.beginPath(); ctx.ellipse(0,2,11,7,0,0,TAU); ctx.fill();
      ctx.fillStyle = th.leaf2||'#7fd968'; ctx.beginPath(); ctx.ellipse(-3,-2,7,5,0,0,TAU); ctx.fill();
      break;
    case 'pine': {
      shadow(11);
      ctx.fillStyle='#7a5230'; ctx.fillRect(-2,3,4,9);
      for(let i=0;i<3;i++){
        const top=-24+i*9, hw=8+i*3;
        polygon([[0,top],[-hw,top+15],[hw,top+15]]);
        ctx.fillStyle = i%2 ? th.leaf : th.leaf2||th.leaf; ctx.fill();
        if(th.snowy){ polygon([[0,top],[-hw*0.55,top+8],[hw*0.55,top+8]]); ctx.fillStyle='#ffffff'; ctx.fill(); }
      }
      break;
    }
    case 'tree':
      shadow(12);
      ctx.fillStyle='#7a5230'; ctx.fillRect(-2.5,-2,5,14);
      ctx.fillStyle=th.leaf; ctx.beginPath(); ctx.arc(-6,-8,8,0,TAU); ctx.arc(6,-8,8,0,TAU); ctx.fill();

      rrect(-11,-9,5,4,2); ctx.fill(); ctx.stroke(); rrect(-11,-15,4,9,2); ctx.fill(); ctx.stroke();
      rrect(6,-6,5,4,2); ctx.fill(); ctx.stroke(); rrect(7,-12,4,9,2); ctx.fill(); ctx.stroke();

      break;
    }
    case 'skull':
      shadow(8);
      ctx.fillStyle='#efe6d2'; ctx.strokeStyle='#8a7a66'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(0,-2,8,0,TAU); ctx.fill(); ctx.stroke();
      rrect(-4,3,8,6,2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#3a2a1c'; ctx.beginPath(); ctx.arc(-3,-2,2,0,TAU); ctx.arc(3,-2,2,0,TAU); ctx.fill();
      break;
    case 'cloud':
      ctx.fillStyle='rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.arc(-12,2,8,0,TAU); ctx.arc(-3,-4,11,0,TAU); ctx.arc(9,-1,9,0,TAU); ctx.arc(16,4,6,0,TAU); ctx.fill();
      ctx.fillRect(-12,2,28,8);
      ctx.fillStyle='rgba(150,190,230,0.25)'; ctx.fillRect(-12,7,28,3);
      break;
    case 'star': {
      const tw = 1+0.15*Math.sin(t*3+d.x);
      ctx.scale(tw,tw); ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#e0a010'; ctx.lineWidth=1;
      ctx.beginPath();
      for(let i=0;i<10;i++){ const r=i%2?4:9, a=-Math.PI/2+i*Math.PI/5; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    }
    case 'palm': {
      shadow(10);
      ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(0,11); ctx.quadraticCurveTo(5,-4,2,-16); ctx.stroke();
      ctx.fillStyle='#3fae5a';
      for(let i=0;i<5;i++){
        ctx.save(); ctx.translate(2,-16); ctx.rotate(-Math.PI/2 + (i-2)*0.75 + Math.sin(t*2+i)*0.05);
        ctx.beginPath(); ctx.ellipse(10,0,11,3.6,0,0,TAU); ctx.fill(); ctx.restore();
      }
      ctx.fillStyle='#7a4a22'; ctx.beginPath(); ctx.arc(0,-14,2.2,0,TAU); ctx.arc(4,-14,2.2,0,TAU); ctx.fill();
      break;
    }
    case 'shell':
      ctx.fillStyle=['#ffb3c7','#ffe0b0','#d9c2ff'][d.hue%3]; ctx.strokeStyle='rgba(120,70,70,0.5)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,6); ctx.quadraticCurveTo(-11,-2,-6,-8); ctx.quadraticCurveTo(0,-11,6,-8); ctx.quadraticCurveTo(11,-2,0,6); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,6); ctx.lineTo(0,-9); ctx.moveTo(0,6); ctx.lineTo(-5,-7); ctx.moveTo(0,6); ctx.lineTo(5,-7); ctx.stroke();
      break;
    case 'snowman':
      shadow(10);
      ctx.fillStyle='#ffffff'; ctx.strokeStyle='#a9c4da'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(0,3,9,0,TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,-9,6.5,0,TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#2b2b2b'; ctx.beginPath(); ctx.arc(-2.3,-10.5,1,0,TAU); ctx.arc(2.3,-10.5,1,0,TAU); ctx.fill();
      ctx.fillStyle='#ff8a3d'; polygon([[0,-8.5],[7,-7.5],[0,-6.5]]); ctx.fill();
      ctx.fillStyle='#e8543d'; ctx.fillRect(-6.5,-4,13,3);
      break;
    case 'ice': {
      ctx.fillStyle='rgba(180,225,250,0.9)'; ctx.strokeStyle='#8fc3e3'; ctx.lineWidth=1.2;
      polygon([[-9,9],[-5,-8],[0,9]]); ctx.fill(); ctx.stroke();
      polygon([[-2,9],[4,-14],[10,9]]); ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.7)'; polygon([[3,-10],[4,-14],[5,-4]]); ctx.fill();
      break;
    }
    case 'torch': {
      shadow(8);
      ctx.fillStyle='#4a3a30'; rrect(-2.5,-4,5,16,2); ctx.fill();
      ctx.fillStyle='#2a2025'; rrect(-5,-8,10,5,2); ctx.fill();
      const f = Math.sin(t*10+d.x)*2;
      ctx.fillStyle='rgba(255,140,50,0.25)'; ctx.beginPath(); ctx.arc(0,-14,13,0,TAU); ctx.fill();
      ctx.fillStyle='#ff7a3d'; polygon([[-5,-8],[0,-22+f],[5,-8]]); ctx.fill();
      ctx.fillStyle='#ffd23f'; polygon([[-2.5,-8],[0,-16+f*0.6],[2.5,-8]]); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

function drawBackground(t){
  const th = state.theme;
  ctx.fillStyle = th.ground;
  ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  ctx.fillStyle = th.stripe;
  for(let y=0;y<CANVAS_H;y+=28){
    if((y/28)%2===0) ctx.fillRect(0,y,CANVAS_W,14);
  }
  for(const d of decorProps) drawDecorItem(d, th, t);
}

function drawAmbient(t){
  const th = state.theme;
  if(th.ambient==='none') return;
  ctx.save();
  for(const p of ambientProps){
    if(th.ambient==='snow'){
      const y = (p.y + t*p.sp*24) % CANVAS_H, x = p.x + Math.sin(t*0.8+p.ph)*12;
      ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(x,y,p.s*0.8,0,TAU); ctx.fill();
    } else if(th.ambient==='ember'){
      const y = CANVAS_H - ((p.y + t*p.sp*30) % CANVAS_H), x = p.x + Math.sin(t*2+p.ph)*8;
      ctx.fillStyle=`rgba(255,${120+Math.floor(80*p.sp/1.8)},50,${0.35+0.5*(y/CANVAS_H)})`;
      ctx.beginPath(); ctx.arc(x,y,p.s*0.7,0,TAU); ctx.fill();
    } else if(th.ambient==='leaf'){
      const x = (p.x + t*p.sp*10) % CANVAS_W, y = (p.y + t*p.sp*18) % CANVAS_H;
      ctx.fillStyle=th.ambientColor; ctx.globalAlpha=0.8;
      ctx.save(); ctx.translate(x,y); ctx.rotate(t*p.sp+p.ph);
      ctx.beginPath(); ctx.ellipse(0,0,p.s*1.8,p.s*0.9,0,0,TAU); ctx.fill(); ctx.restore();
      ctx.globalAlpha=1;
    } else if(th.ambient==='dust'){
      const x = (p.x + t*p.sp*45) % CANVAS_W, y = p.y + Math.sin(t+p.ph)*6;
      ctx.fillStyle=`rgba(${th.ambientColor},0.45)`; ctx.beginPath(); ctx.ellipse(x,y,p.s*3,p.s*0.7,0,0,TAU); ctx.fill();
    } else if(th.ambient==='bubble'){
      const y = CANVAS_H - ((p.y + t*p.sp*12) % CANVAS_H), x = p.x + Math.sin(t+p.ph)*6;
      ctx.strokeStyle=`rgba(${th.ambientColor},0.6)`; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(x,y,p.s*1.6,0,TAU); ctx.stroke();
    } else if(th.ambient==='sparkle'){
      const a = Math.max(0, Math.sin(t*2+p.ph));
      if(a>0.05){
        ctx.strokeStyle=th.ambientColor; ctx.globalAlpha=a*0.9; ctx.lineWidth=1.5;
        const r = p.s*2*a+1;
        ctx.beginPath(); ctx.moveTo(p.x-r,p.y); ctx.lineTo(p.x+r,p.y); ctx.moveTo(p.x,p.y-r); ctx.lineTo(p.x,p.y+r); ctx.stroke();
        ctx.globalAlpha=1;
      }
    } else if(th.ambient==='cloud'){
      const x = ((p.x + t*p.sp*6) % (CANVAS_W+240)) - 120, y = p.y;
      ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.ellipse(x,y,p.s*14,p.s*4.5,0,0,TAU); ctx.fill();
    }
  }
  ctx.restore();
}

function drawPath(){
  const path = state.cfg.path;
  ctx.save();
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle = state.theme.pathOut;
  ctx.lineWidth = PATH_WIDTH+6;
  ctx.beginPath();
  path.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.stroke();
  ctx.strokeStyle = state.theme.pathIn;
  ctx.lineWidth = PATH_WIDTH;
  ctx.beginPath();
  path.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.stroke();
  ctx.setLineDash([14,14]);
  ctx.strokeStyle = state.theme.dash;
  ctx.lineWidth = 3;
  ctx.beginPath();
  path.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // base flag at the end
  const last = path[path.length-1];
  const prev = path[path.length-2];
  const bx = clamp(last.x, 20, CANVAS_W-20), by = last.y;
  ctx.save();
  ctx.translate(bx,by);
  ctx.fillStyle='#8a6a3c'; ctx.fillRect(-3,-34,6,34);
  ctx.fillStyle='#ff5c5c';
  ctx.beginPath(); ctx.moveTo(3,-34); ctx.lineTo(26,-26); ctx.lineTo(3,-18); ctx.closePath(); ctx.fill();
  ctx.font='26px sans-serif'; ctx.textAlign='center'; ctx.fillText('🏰', -3, 14);
  ctx.restore();

  // spawn marker
  const first = path[0];
  ctx.save();
  ctx.font='22px sans-serif'; ctx.textAlign='center';
  ctx.fillText('🚩', clamp(first.x,18,CANVAS_W-18), first.y+8);
  ctx.restore();
}

function drawCuteFace(x,y,r, blush=true){
  // eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(x-r*0.32,y-r*0.08,r*0.22,r*0.26,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+r*0.32,y-r*0.08,r*0.22,r*0.26,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2b2b2b';
  ctx.beginPath(); ctx.arc(x-r*0.28,y-r*0.02,r*0.1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.36,y-r*0.02,r*0.1,0,Math.PI*2); ctx.fill();
  // mouth
  ctx.strokeStyle='#2b2b2b'; ctx.lineWidth=Math.max(1.2,r*0.07);
  ctx.beginPath(); ctx.arc(x,y+r*0.12,r*0.28,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  if(blush){
    ctx.fillStyle='rgba(255,120,140,0.45)';
    ctx.beginPath(); ctx.ellipse(x-r*0.55,y+r*0.2,r*0.16,r*0.1,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+r*0.55,y+r*0.2,r*0.16,r*0.1,0,0,Math.PI*2); ctx.fill();
  }
}

/* ---------- Elemental warriors (used on the map, build preview and menu icons) ---------- */
const WARRIOR_SKIN = '#ffd9b8';
const WARRIOR_OUTLINE = '#3a2a1c';
const WARRIOR_SWING = { fire:1.4, water:0.8, earth:1.7, wind:0.35, thunder:1.0 };
const TAU = Math.PI*2;

function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fillStroke(fill){ ctx.fillStyle=fill; ctx.fill(); ctx.stroke(); }

function drawWarriorWeapon(type, t){
  // weapon is drawn pointing up (-y) from the hand at the origin
  if(type==='fire'){
    const f = Math.sin(t*10)*1.5;
    ctx.fillStyle='#5b3d27'; ctx.fillRect(-1.5,-2,3,7);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(-5,-4,10,2.5);
    ctx.beginPath(); ctx.moveTo(-3,-4); ctx.lineTo(-2.5,-25); ctx.lineTo(0,-30); ctx.lineTo(2.5,-25); ctx.lineTo(3,-4); ctx.closePath();
    fillStroke('#ffb347');
    ctx.fillStyle='#fff3c4'; ctx.fillRect(-0.8,-24,1.6,19);
    ctx.fillStyle='rgba(255,110,50,0.85)';
    ctx.beginPath(); ctx.moveTo(-3,-14); ctx.lineTo(-7,-20+f); ctx.lineTo(-3,-22); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(3,-18); ctx.lineTo(7,-26-f); ctx.lineTo(3,-27); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2,-28); ctx.lineTo(0,-37-f); ctx.lineTo(2,-28); ctx.closePath(); ctx.fill();
  } else if(type==='water'){
    ctx.fillStyle='#6fb3e0'; ctx.fillRect(-1.3,-27,2.6,33);
    ctx.strokeStyle='#d6f1ff'; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(-6,-33); ctx.lineTo(-6,-25); ctx.quadraticCurveTo(0,-20,6,-25); ctx.lineTo(6,-33); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-25); ctx.lineTo(0,-37); ctx.stroke();
    ctx.fillStyle='rgba(190,232,255,0.9)';
    for(let i=0;i<3;i++){
      const a = t*2.5 + i*2.1;
      ctx.beginPath(); ctx.arc(Math.cos(a)*9, -28+Math.sin(a)*3.5, 1.8, 0, TAU); ctx.fill();
    }
  } else if(type==='earth'){
    ctx.fillStyle='#7a5230'; ctx.fillRect(-1.6,-24,3.2,30);
    rrect(-9,-34,18,12,3); ctx.lineWidth=1.4;
    fillStroke('#9c9a94');
    ctx.fillStyle='#c9c7c0'; ctx.fillRect(-7,-32,6,3);
    ctx.fillStyle='#6e4b28'; ctx.fillRect(-9,-30,18,2.2);
  } else if(type==='wind'){
    ctx.strokeStyle='#2f8f6f'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(0,-30); ctx.quadraticCurveTo(11,-14,0,2); ctx.stroke();
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(-2,-14); ctx.lineTo(0,2); ctx.stroke();
    ctx.strokeStyle='#8a6a3c'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(-2,-14); ctx.lineTo(12,-14); ctx.stroke();
    ctx.fillStyle='#e8f7f1';
    ctx.beginPath(); ctx.moveTo(12,-17); ctx.lineTo(17,-14); ctx.lineTo(12,-11); ctx.closePath(); ctx.fill();
  } else if(type==='thunder'){
    ctx.fillStyle='#8a6a3c'; ctx.fillRect(-1.3,-30,2.6,36);
    ctx.beginPath(); ctx.moveTo(2,-40); ctx.lineTo(-4,-29); ctx.lineTo(-0.5,-29); ctx.lineTo(-3,-20); ctx.lineTo(4,-32); ctx.lineTo(0.5,-32); ctx.closePath();
    ctx.lineWidth=1.2; fillStroke('#fff07a');
    if(Math.sin(t*18)>0.2){
      ctx.strokeStyle='rgba(255,240,122,0.9)'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(4,-34); ctx.lineTo(8,-37); ctx.lineTo(7,-31); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-4,-28); ctx.lineTo(-8,-31); ctx.lineTo(-7,-25); ctx.stroke();
    }
  }
}

function drawWarriorHelmet(type, t){
  // head centre is (0,-14); helmets cover only the area above y=-16 so the face stays visible
  const dome = (fill)=>{
    ctx.beginPath(); ctx.arc(0,-16,11,Math.PI,0); ctx.closePath(); fillStroke(fill);
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(-4,-22,3,1.8,-0.5,0,TAU); ctx.fill();
  };
  ctx.lineWidth=1.4; ctx.strokeStyle=WARRIOR_OUTLINE;
  if(type==='fire'){
    const f = Math.sin(t*9)*2;
    ctx.fillStyle='#ffce54';
    ctx.beginPath(); ctx.moveTo(-6,-25); ctx.lineTo(-4,-34+f); ctx.lineTo(0,-27); ctx.lineTo(3,-37-f); ctx.lineTo(6,-25); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ff7a3d';
    ctx.beginPath(); ctx.moveTo(-3,-26); ctx.lineTo(0,-32+f*0.5); ctx.lineTo(3,-26); ctx.closePath(); ctx.fill();
    dome('#d9402a');
  } else if(type==='water'){
    dome('#4ea8de');
    ctx.beginPath(); ctx.moveTo(-4,-26); ctx.quadraticCurveTo(0,-38,9,-33); ctx.quadraticCurveTo(3,-31,3,-26); ctx.closePath();
    fillStroke('#bfe8ff');
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(0,-19.5,2,0,TAU); ctx.fill();
  } else if(type==='earth'){
    ctx.fillStyle='#f4ead2';
    ctx.beginPath(); ctx.moveTo(-9,-22); ctx.quadraticCurveTo(-18,-23,-14,-34); ctx.quadraticCurveTo(-12,-27,-6,-25); ctx.closePath(); fillStroke('#f4ead2');
    ctx.beginPath(); ctx.moveTo(9,-22); ctx.quadraticCurveTo(18,-23,14,-34); ctx.quadraticCurveTo(12,-27,6,-25); ctx.closePath(); fillStroke('#f4ead2');
    dome('#8a6a45');
    ctx.fillStyle='#5a4228'; ctx.fillRect(-1.2,-27,2.4,10);
  } else if(type==='wind'){
    ctx.save(); ctx.translate(6,-25); ctx.rotate(0.55+Math.sin(t*3)*0.15);
    ctx.beginPath(); ctx.ellipse(0,-7,3.2,8,0,0,TAU); fillStroke('#ffffff');
    ctx.restore();
    ctx.save(); ctx.translate(3,-26); ctx.rotate(0.15+Math.sin(t*3+1)*0.15);
    ctx.beginPath(); ctx.ellipse(0,-6,2.6,6.5,0,0,TAU); fillStroke('#ffe066');
    ctx.restore();
    dome('#59c9a5');
    ctx.fillStyle='#ffffff'; ctx.fillRect(-11,-19,22,3);
  } else if(type==='thunder'){
    ctx.beginPath();
    ctx.moveTo(-11,-16); ctx.lineTo(-12,-28); ctx.lineTo(-6,-23); ctx.lineTo(-4,-34); ctx.lineTo(0,-25);
    ctx.lineTo(4,-35); ctx.lineTo(6,-23); ctx.lineTo(12,-28); ctx.lineTo(11,-16); ctx.closePath();
    fillStroke('#f4d35e');
    ctx.fillStyle='#3a3a5c'; ctx.fillRect(-11,-19,22,3);
    ctx.fillStyle='#fff07a'; ctx.fillRect(-1.5,-19,3,3);
  }
}

// x,y = body centre, s = scale, facing = 1 (right) or -1 (left), atk = 0..1 weapon swing
function drawWarrior(type, x, y, s, t, facing, atk){
  const T = TOWER_TYPES[type];
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s*facing, s);
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle=WARRIOR_OUTLINE; ctx.lineWidth=1.4;
  const sway = Math.sin(t*3)*1.5;

  // cape
  ctx.beginPath(); ctx.moveTo(-8,-3); ctx.quadraticCurveTo(-15+sway,8,-12+sway*1.5,19); ctx.lineTo(8,18); ctx.lineTo(8,-3); ctx.closePath();
  fillStroke(T.dark);
  // legs / boots
  rrect(-7,11,6,9,2); fillStroke('#5b3d27');
  rrect(1,11,6,9,2); fillStroke('#5b3d27');
  // torso
  const g = ctx.createLinearGradient(0,-4,0,13);
  g.addColorStop(0,T.color); g.addColorStop(1,T.dark);
  rrect(-9,-4,18,17,5); fillStroke(g);
  ctx.fillStyle=WARRIOR_OUTLINE; ctx.fillRect(-9,7,18,3);
  ctx.fillStyle='#ffd23f'; ctx.fillRect(-2,6.5,4,4);
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(0,1,2.6,0,TAU); ctx.fill();
  // shoulder pads
  ctx.beginPath(); ctx.arc(-9,-2,4.5,0,TAU); fillStroke(T.dark);
  ctx.beginPath(); ctx.arc(9,-2,4.5,0,TAU); fillStroke(T.dark);

  if(type==='earth'){
    rrect(-18,-3,9,15,4); fillStroke('#8a8780');
    ctx.fillStyle='#6e4b28'; ctx.fillRect(-15,0,3,9);
  }

  // head, face, helmet
  ctx.beginPath(); ctx.arc(0,-14,10,0,TAU); fillStroke(WARRIOR_SKIN);
  drawCuteFace(0,-12,9);
  drawWarriorHelmet(type, t);

  // weapon arm
  ctx.save();
  ctx.translate(10,3);
  ctx.rotate(0.45 + atk*WARRIOR_SWING[type]);
  ctx.lineWidth=1.2;
  drawWarriorWeapon(type, t);
  ctx.beginPath(); ctx.arc(0,0,3.2,0,TAU); fillStroke(WARRIOR_SKIN);
  ctx.restore();

  ctx.restore();
}

function renderWarriorIcon(canvasEl, type){
  const dpr = 2;
  canvasEl.width = 48*dpr; canvasEl.height = 58*dpr;
  const saved = ctx;
  ctx = canvasEl.getContext('2d');
  ctx.scale(dpr,dpr);
  drawWarrior(type, 24, 39, 0.85, 0, 1, 0);
  ctx = saved;
}

function drawTower(tower, t){
  const {x,y} = tower;
  // pad
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(x,y+20,22,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = state.theme.pathIn;
  ctx.beginPath(); ctx.ellipse(x,y+16,24,10,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=state.theme.pathOut; ctx.lineWidth=3; ctx.stroke();

  const bob = Math.sin(t*2 + x)*1.2;
  drawWarrior(tower.type, x, y-8+bob, 1.15+(tower.level-1)*0.05, t, tower.facing||1, tower.attackT||0);

  // level stars pips
  for(let i=0;i<tower.level;i++){
    ctx.fillStyle='#ffd23f';
    ctx.beginPath(); ctx.arc(x-14+i*7, y+24, 2.6,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  if(state.selectedTower===tower || state.hoverTower===tower){
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.setLineDash([6,6]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,towerStat(tower,'range'),0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function drawEnemy(e){
  ctx.save();
  const bob = Math.sin(e.bob)*2;
  const cx=e.x, cy=e.y+bob;
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(e.x,e.y+e.radius*0.7,e.radius*0.8,e.radius*0.3,0,0,Math.PI*2); ctx.fill();

  const flash = e.hitFlash>0;
  ctx.fillStyle = flash? '#ffffff' : e.color;
  ctx.beginPath();
  if(e.type==='slime'){
    ctx.ellipse(cx,cy,e.radius*1.1,e.radius*0.85,0,0,Math.PI*2);
  } else {
    ctx.arc(cx,cy,e.radius,0,Math.PI*2);
  }
  ctx.fill();
  ctx.strokeStyle = flash? '#fff' : e.dark; ctx.lineWidth=2.5; ctx.stroke();

  if(e.type==='bat'){
    ctx.fillStyle=e.dark;
    ctx.beginPath(); ctx.moveTo(cx-e.radius,cy); ctx.lineTo(cx-e.radius-9,cy-7); ctx.lineTo(cx-e.radius-2,cy+3); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+e.radius,cy); ctx.lineTo(cx+e.radius+9,cy-7); ctx.lineTo(cx+e.radius+2,cy+3); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx-5,cy-e.radius); ctx.lineTo(cx-7,cy-e.radius-7); ctx.lineTo(cx-2,cy-e.radius+1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+5,cy-e.radius); ctx.lineTo(cx+7,cy-e.radius-7); ctx.lineTo(cx+2,cy-e.radius+1); ctx.closePath(); ctx.fill();
  }
  if(e.type==='tank'){
    ctx.strokeStyle=e.dark; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,e.radius*0.65,Math.PI,Math.PI*2); ctx.stroke();
  }
  if(e.type==='brute'){
    ctx.strokeStyle=e.dark; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx-e.radius*0.5,cy-e.radius*0.5); ctx.lineTo(cx-e.radius*0.15,cy-e.radius*0.75); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+e.radius*0.5,cy-e.radius*0.5); ctx.lineTo(cx+e.radius*0.15,cy-e.radius*0.75); ctx.stroke();
  }
  if(e.type==='boss'){
    ctx.fillStyle='#ffd23f';
    for(let i=-1;i<=1;i++){
      ctx.beginPath();
      ctx.moveTo(cx+i*14-6,cy-e.radius*0.85);
      ctx.lineTo(cx+i*14,cy-e.radius*1.3);
      ctx.lineTo(cx+i*14+6,cy-e.radius*0.85);
      ctx.closePath(); ctx.fill();
    }
  }
  drawCuteFace(cx,cy, e.radius*0.95, e.type!=='boss');
  ctx.restore();

  // hp bar
  if(e.hp<e.maxHp){
    const w = e.radius*2;
    ctx.save();
    ctx.translate(e.x-w/2, e.y-e.radius-12);
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,w,5);
    ctx.fillStyle = e.hp/e.maxHp>0.5? '#6fd66f' : (e.hp/e.maxHp>0.25? '#ffcc4d':'#ff5c5c');
    ctx.fillRect(0,0,w*clamp(e.hp/e.maxHp,0,1),5);
    ctx.restore();
  }
}

function drawProjectile(p){
  ctx.save();
  ctx.fillStyle = p.color;
  ctx.beginPath();
  if(p.towerType==='earth'){ ctx.rect(p.x-4,p.y-4,8,8); }
  else { ctx.arc(p.x,p.y,5,0,Math.PI*2); }
  ctx.fill();
  ctx.restore();
}

function drawParticle(pa){
  const alpha = clamp(1-pa.life/pa.maxLife,0,1);
  ctx.save();
  ctx.globalAlpha = alpha;
  if(pa.kind==='poof'){
    ctx.fillStyle = pa.color;
    ctx.beginPath(); ctx.arc(pa.x,pa.y,pa.size,0,Math.PI*2); ctx.fill();
  } else if(pa.kind==='text'){
    ctx.fillStyle = pa.color;
    ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
    ctx.fillText(pa.text, pa.x, pa.y);
  } else if(pa.kind==='bolt'){
    ctx.strokeStyle = pa.color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(pa.x1,pa.y1);
    const mx=(pa.x1+pa.x2)/2+(Math.random()-0.5)*14, my=(pa.y1+pa.y2)/2+(Math.random()-0.5)*14;
    ctx.lineTo(mx,my); ctx.lineTo(pa.x2,pa.y2); ctx.stroke();
  }
  ctx.restore();
}

function drawBuildPreview(){
  if(!state.selectedBuildType || !state.hoverPos) return;
  const type = TOWER_TYPES[state.selectedBuildType];
  const {x,y} = state.hoverPos;
  const valid = canPlaceTowerAt(x,y);
  ctx.save();
  ctx.globalAlpha=0.65;
  drawWarrior(state.selectedBuildType, x, y-8, 1.15, performance.now()/1000, 1, 0);
  if(!valid){
    ctx.globalAlpha=0.35; ctx.fillStyle='#ff3b3b';
    ctx.beginPath(); ctx.ellipse(x,y+16,24,10,0,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=0.25;
  ctx.strokeStyle = valid? '#2ecc71' : '#ff5c5c';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y,type.range,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function render(t){
  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  drawBackground(t/1000);
  drawPath();
  for(const tower of state.towers) drawTower(tower, t/1000);
  for(const e of state.enemies) drawEnemy(e);
  for(const p of state.projectiles) drawProjectile(p);
  for(const pa of state.particles) drawParticle(pa);
  drawAmbient(t/1000);
  drawBuildPreview();
}

/* ============================================================
   TOWER PLACEMENT / SELECTION LOGIC
============================================================ */
const TOWER_RADIUS = 20;
function canPlaceTowerAt(x,y){
  if(x<TOWER_RADIUS || x>CANVAS_W-TOWER_RADIUS || y<TOWER_RADIUS || y>CANVAS_H-TOWER_RADIUS) return false;
  if(distToPath(x,y,state.cfg.path) < PATH_WIDTH/2+TOWER_RADIUS-2) return false;
  for(const tw of state.towers){ if(dist(tw.x,tw.y,x,y) < TOWER_RADIUS*2) return false; }
  return true;
}

function placeTower(type, x, y){
  const cost = TOWER_TYPES[type].cost;
  if(state.gold < cost) return false;
  if(!canPlaceTowerAt(x,y)) return false;
  state.gold -= cost;
  state.towers.push({ type, x, y, level:1, cooldown:0, target:null, angle:0 });
  playSfx('place');
  return true;
}

function sellTower(tower){
  const refund = Math.round(towerTotalSpent(tower)*0.7);
  state.gold += refund;
  state.towers = state.towers.filter(t=>t!==tower);
  state.selectedTower = null;
  playSfx('place');
}

function upgradeTower(tower){
  if(tower.level>=MAX_TOWER_LEVEL) return;
  const cost = upgradeCost(tower);
  if(state.gold < cost) return;
  state.gold -= cost;
  tower.level++;
  playSfx('place');
}

/* ============================================================
   INPUT HANDLING
============================================================ */
function canvasPos(evt){
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W/rect.width, scaleY = CANVAS_H/rect.height;
  return { x:(evt.clientX-rect.left)*scaleX, y:(evt.clientY-rect.top)*scaleY };
}

canvas.addEventListener('mousemove', (evt)=>{
  state.hoverPos = canvasPos(evt);
  state.hoverTower = state.towers.find(t=> dist(t.x,t.y,state.hoverPos.x,state.hoverPos.y) < TOWER_RADIUS) || null;
});
canvas.addEventListener('mouseleave', ()=>{ state.hoverPos=null; state.hoverTower=null; });

canvas.addEventListener('click', (evt)=>{
  const {x,y} = canvasPos(evt);
  const clickedTower = state.towers.find(t=> dist(t.x,t.y,x,y) < TOWER_RADIUS);
  if(state.selectedBuildType){
    if(!clickedTower){
      const ok = placeTower(state.selectedBuildType, x, y);
      if(ok){ state.selectedBuildType=null; refreshTowerButtons(); }
    }
    return;
  }
  if(clickedTower){ state.selectedTower = clickedTower; renderUpgradePanel(); }
  else { state.selectedTower = null; renderUpgradePanel(); }
});

/* ============================================================
   SIDEBAR: tower buttons + upgrade panel
============================================================ */
const towerButtonsEl = document.getElementById('tower-buttons');
function buildTowerButtons(){
  towerButtonsEl.innerHTML = '';
  TOWER_ORDER.forEach(key=>{
    const type = TOWER_TYPES[key];
    const btn = document.createElement('button');
    btn.className = 'tower-btn ghost';
    btn.innerHTML = `<span class="ic"><canvas></canvas></span><span class="info"><b>${type.name}</b><small>🪙${type.cost} · ${type.desc}</small></span>`;
    renderWarriorIcon(btn.querySelector('canvas'), key);
    btn.dataset.key = key;
    btn.addEventListener('click', ()=>{
      state.selectedBuildType = (state.selectedBuildType===key) ? null : key;
      state.selectedTower = null;
      renderUpgradePanel();
      refreshTowerButtons();
    });
    towerButtonsEl.appendChild(btn);
  });
  refreshTowerButtons();
}
function refreshTowerButtons(){
  [...towerButtonsEl.children].forEach(btn=>{
    const key = btn.dataset.key;
    btn.classList.toggle('selected', state.selectedBuildType===key);
    btn.disabled = state.gold < TOWER_TYPES[key].cost;
  });
}

const upgradePanelEl = document.getElementById('upgrade-panel');
function renderUpgradePanel(){
  const tower = state.selectedTower;
  if(!tower){ upgradePanelEl.classList.add('hidden'); upgradePanelEl.innerHTML=''; return; }
  upgradePanelEl.classList.remove('hidden');
  const type = TOWER_TYPES[tower.type];
  const maxed = tower.level>=MAX_TOWER_LEVEL;
  const cost = upgradeCost(tower);
  const refund = Math.round(towerTotalSpent(tower)*0.7);
  upgradePanelEl.innerHTML = `
    <div style="text-align:center;font-weight:bold;">${type.emoji} ${type.name} · เลเวล ${tower.level}</div>
    <div class="row"><span>⚔️ ดาเมจ</span><span>${towerStat(tower,'dmg').toFixed(0)}</span></div>
    <div class="row"><span>🎯 ระยะ</span><span>${towerStat(tower,'range').toFixed(0)}</span></div>
    <div class="row"><span>⏱️ อัตรายิง</span><span>${(towerStat(tower,'rate')/1000).toFixed(2)}s</span></div>
    <div class="btn-row">
      <button class="small" id="btn-upgrade" ${maxed||state.gold<cost?'disabled':''}>${maxed?'⭐ สูงสุด':'⬆️ อัพ 🪙'+cost}</button>
      <button class="small danger" id="btn-sell">💰 ขาย 🪙${refund}</button>
    </div>
  `;
  document.getElementById('btn-upgrade')?.addEventListener('click', ()=>{ upgradeTower(tower); renderUpgradePanel(); });
  document.getElementById('btn-sell')?.addEventListener('click', ()=>{ sellTower(tower); renderUpgradePanel(); });
}

/* ============================================================
   HUD
============================================================ */
const hudGold = document.getElementById('hud-gold');
const hudLives = document.getElementById('hud-lives');
const hudWave = document.getElementById('hud-wave');
const hudLevel = document.getElementById('hud-level');
const waveTextEl = document.getElementById('wave-text');
const btnNextWave = document.getElementById('btn-next-wave');

function updateHUD(){
  hudGold.textContent = '🪙 ' + state.gold;
  hudLives.textContent = '❤️ ' + state.lives;
  hudLevel.textContent = `ด่าน ${state.level} · ${state.theme.emoji} ${state.theme.name}`;
  const waveNum = Math.min(state.waveIndex+1, state.cfg.waves.length);
  hudWave.textContent = `🌊 คลื่น ${Math.max(waveNum,0)}/${state.cfg.waves.length}`;
  if(state.waveActive){
    waveTextEl.textContent = `⚔️ กำลังต่อสู้... (เหลือ ${state.enemies.filter(e=>e.alive).length + state.waveQueue.length})`;
    btnNextWave.disabled = true;
  } else if(state.waveIndex >= state.cfg.waves.length-1 && !state.levelWon){
    waveTextEl.textContent = `🏁 คลื่นสุดท้ายกำลังจะมา...`;
    btnNextWave.disabled = false;
  } else {
    waveTextEl.textContent = `⏳ คลื่นถัดไปใน ${Math.ceil(state.betweenWaveTimer/1000)} วิ`;
    btnNextWave.disabled = false;
  }
  refreshTowerButtons();
}

/* ============================================================
   MODAL / OVERLAY
============================================================ */
const overlayEl = document.getElementById('overlay');
const modalEl = document.getElementById('modal-content');
function showModal({title, emoji, body, stars, buttons}){
  let starsHtml = '';
  if(stars!==undefined){
    starsHtml = `<div class="stars-big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`;
  }
  modalEl.innerHTML = `
    <div style="font-size:50px;">${emoji||''}</div>
    <h2>${title}</h2>
    <p>${body||''}</p>
    ${starsHtml}
    <div class="modal-btns">${buttons.map((b,i)=>`<button data-i="${i}">${b.label}</button>`).join('')}</div>
  `;
  [...modalEl.querySelectorAll('button[data-i]')].forEach((btn,i)=>{
    btn.addEventListener('click', buttons[i].action);
  });
  overlayEl.classList.remove('hidden');
}
function hideModal(){ overlayEl.classList.add('hidden'); }

/* ============================================================
   SCREEN MANAGEMENT
============================================================ */
const screenMenu = document.getElementById('screen-menu');
const screenLevels = document.getElementById('screen-levels');
const screenGame = document.getElementById('screen-game');
function showScreen(el){
  [screenMenu, screenLevels, screenGame].forEach(s=>s.classList.add('hidden'));
  el.classList.remove('hidden');
}
function applyPageTheme(th){
  document.body.style.background = th ? th.bodyBg : '';
  document.body.classList.toggle('dark', !!(th && th.dark));
}
function showMenu(){ applyPageTheme(null); showScreen(screenMenu); }
function showLevels(){ applyPageTheme(null); buildLevelGrid(); showScreen(screenLevels); }

const lvlGrid = document.getElementById('lvl-grid');
function buildLevelGrid(){
  lvlGrid.innerHTML = '';
  for(let i=1;i<=TOTAL_LEVELS;i++){
    const locked = i>progress.unlocked;
    const stars = progress.stars[i]||0;
    const th = THEMES[i-1];
    const btn = document.createElement('button');
    btn.className = 'lvl-btn' + (locked?' locked':'');
    btn.disabled = locked;
    btn.innerHTML = `<div class="num">${locked?'🔒':i}</div><div class="stars">${locked?'':('⭐'.repeat(stars)+'☆'.repeat(3-stars))}</div><div class="tname">${th.emoji} ${th.name}</div>`;
    if(!locked) btn.addEventListener('click', ()=> openLevel(i));
    lvlGrid.appendChild(btn);
  }
}

function openLevel(level){
  resetStateForLevel(level);
  buildDecor(level);
  buildTowerButtons();
  renderUpgradePanel();
  applyPageTheme(state.theme);
  showScreen(screenGame);
  updateHUD();
}

/* ============================================================
   TOP-LEVEL BUTTONS
============================================================ */
document.getElementById('btn-play').addEventListener('click', showLevels);
document.getElementById('btn-back-menu').addEventListener('click', showMenu);
document.getElementById('btn-quit').addEventListener('click', ()=>{ showLevels(); });
document.getElementById('btn-howto').addEventListener('click', ()=>{
  showModal({
    title:'วิธีเล่น', emoji:'📖',
    body:`สร้างหอคอยธาตุ 🔥💧🪨🌪️⚡ ริมเส้นทาง เพื่อสกัดศัตรูไม่ให้ถึงปราสาท 🏰<br><br>
          • เลือกหอคอยจากแถบด้านข้าง แล้วคลิกบนพื้นที่ว่างเพื่อสร้าง<br>
          • คลิกหอคอยที่สร้างแล้วเพื่ออัพเกรดหรือขาย<br>

    buttons:[{label:'เข้าใจแล้ว!', action:hideModal}]
  });
});
document.getElementById('btn-reset').addEventListener('click', ()=>{
  showModal({
    title:'ล้างความคืบหน้า?', emoji:'⚠️', body:'การกระทำนี้ไม่สามารถย้อนกลับได้',
    buttons:[
      {label:'ยืนยัน', action:()=>{ progress={unlocked:1,stars:{}}; saveProgress(progress); hideModal(); }},
      {label:'ยกเลิก', action:hideModal},
    ]
  });
});
document.getElementById('btn-pause').addEventListener('click', (e)=>{
  state.paused = !state.paused;
  e.target.textContent = state.paused? '▶️' : '⏸️';
});
document.getElementById('btn-speed').addEventListener('click', (e)=>{
  state.speedMult = state.speedMult===1 ? 2 : 1;
  e.target.textContent = '⏩ x'+state.speedMult;
});
document.getElementById('btn-sound').addEventListener('click', (e)=>{
  state.soundOn = !state.soundOn;
  e.target.textContent = state.soundOn? '🔊' : '🔇';
});
btnNextWave.addEventListener('click', ()=>{
  if(!state.waveActive && !state.gameOver && !state.levelWon) startNextWave();
});

/* ============================================================
   AUDIO (synthesized, no external files)
============================================================ */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  return audioCtx;
}
function playSfx(kind, vol=0.35){
  if(!state.soundOn) return;
  const ac = getAudioCtx();
  if(!ac) return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.connect(g); g.connect(ac.destination);
  let freq=440, type='sine', dur=0.12;
  if(kind==='shoot'){ freq=680; type='triangle'; dur=0.06; }
  else if(kind==='kill'){ freq=880; type='square'; dur=0.08; }
  else if(kind==='hurt'){ freq=160; type='sawtooth'; dur=0.18; }
  else if(kind==='place'){ freq=520; type='sine'; dur=0.1; }
  else if(kind==='wave'){ freq=300; type='triangle'; dur=0.3; }
  else if(kind==='win'){ freq=660; type='sine'; dur=0.5; }
  else if(kind==='lose'){ freq=120; type='sawtooth'; dur=0.6; }
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  if(kind==='win'){ o.frequency.exponentialRampToValueAtTime(freq*2,t0+dur); }
  if(kind==='lose'){ o.frequency.exponentialRampToValueAtTime(freq*0.5,t0+dur); }
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.start(t0); o.stop(t0+dur+0.02);
}

/* ============================================================
   MAIN LOOP
============================================================ */
function loop(ts){
  if(!state.lastTime) state.lastTime = ts;
  let dt = ts - state.lastTime;
  state.lastTime = ts;
  dt = Math.min(dt, 80); // avoid huge jumps on tab switch
  if(!screenGame.classList.contains('hidden')){
    updateGame(dt*state.speedMult);
    render(ts);
    updateHUD();
  }
  requestAnimationFrame(loop);
}

/* ============================================================
   INIT
============================================================ */
showMenu();
requestAnimationFrame(loop);
</script>
